<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="{{BG}}"/>
      <stop offset="100%" stop-color="{{BG_END}}"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="{{PRIMARY}}" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect x="80" y="0" width="6" height="720" fill="{{ACCENT}}" opacity="0.08"/>
  <rect x="80" y="220" width="80" height="6" fill="{{ACCENT}}"/>
  <text x="180" y="310" font-family="{{TITLE_FONT}}" font-size="56" font-weight="bold" fill="{{PRIMARY}}">{{TITLE}}</text>
  <text x="180" y="370" font-family="{{BODY_FONT}}" font-size="24" fill="{{SECONDARY}}">{{SUBTITLE}}</text>
  <g transform="translate(180, 440)">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="{{SECONDARY}}" opacity="0.2"/>
    <text x="32" y="17" font-family="{{BODY_FONT}}" font-size="14" fill="{{TEXT}}">{{DATE}}</text>
  </g>
  <rect x="0" y="714" width="1280" height="6" fill="{{ACCENT}}"/>
</svg>