<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本转 PPT 生成器 - Antinet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: 'Courier New', monospace;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 400px;
            line-height: 1.6;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            display: block;
        }

        .example {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 12px;
            color: #6c757d;
        }

        .example code {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .theme-preview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .theme-card {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-card:hover {
            border-color: #667eea;
        }

        .theme-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .theme-card h4 {
            margin-bottom: 5px;
            font-size: 14px;
        }

        .theme-colors {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 文本转 PPT 生成器</h1>
        <p class="subtitle">轻松将 Markdown 文本转换为专业的 PowerPoint 演示文稿</p>

        <form id="pptForm">
            <div class="form-group">
                <label for="title">演示文稿标题</label>
                <input type="text" id="title" name="title" value="我的演示文稿" required>
            </div>

            <div class="form-group">
                <label for="theme">选择主题</label>
                <div class="theme-preview">
                    <div class="theme-card selected" data-theme="professional">
                        <h4>Professional</h4>
                        <div class="theme-colors">
                            <div class="color-box" style="background: #1C2833;"></div>
                            <div class="color-box" style="background: #3498DB;"></div>
                            <div class="color-box" style="background: #F1C40F;"></div>
                        </div>
                    </div>
                    <div class="theme-card" data-theme="creative">
                        <h4>Creative</h4>
                        <div class="theme-colors">
                            <div class="color-box" style="background: #9B59B6;"></div>
                            <div class="color-box" style="background: #3498DB;"></div>
                            <div class="color-box" style="background: #E67E22;"></div>
                        </div>
                    </div>
                    <div class="theme-card" data-theme="minimal">
                        <h4>Minimal</h4>
                        <div class="theme-colors">
                            <div class="color-box" style="background: #2C3E50;"></div>
                            <div class="color-box" style="background: #95A5A6;"></div>
                            <div class="color-box" style="background: #3498DB;"></div>
                        </div>
                    </div>
                </div>
                <input type="hidden" id="theme" name="theme" value="professional">
            </div>

            <div class="form-group">
                <label for="content">内容（支持 Markdown 格式）</label>
                <textarea id="content" name="content" required># 产品发布会

欢迎参加我们的新品发布

## 产品特点

### 创新设计
采用最新的设计理念

### 核心优势
- 高性能处理器
- 超长续航
- 轻薄便携
- 精美外观

## 技术参数

1. 处理器：最新一代芯片
2. 内存：16GB 起步
3. 存储：512GB 固态硬盘
4. 显示：高清视网膜屏幕

## 市场定位

面向追求品质的用户群体

## 总结

感谢大家的支持！</textarea>
                <div class="example">
                    <strong>Markdown 语法提示：</strong><br>
                    <code>#</code> 一级标题（创建标题页） | 
                    <code>##</code> 二级标题（创建新页面） | 
                    <code>###</code> 三级标题（页面小标题） | 
                    <code>-</code> 或 <code>*</code> 无序列表 | 
                    <code>1.</code> 有序列表
                </div>
            </div>

            <button type="submit" id="generateBtn">
                🎨 生成 PPT
            </button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script>
        // 主题选择
        document.querySelectorAll('.theme-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                document.getElementById('theme').value = this.dataset.theme;
            });
        });

        // 表单提交
        document.getElementById('pptForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const statusDiv = document.getElementById('status');
            const generateBtn = document.getElementById('generateBtn');
            
            // 获取表单数据
            const formData = {
                title: document.getElementById('title').value,
                theme: document.getElementById('theme').value,
                content: document.getElementById('content').value,
                filename: `${document.getElementById('title').value}_${Date.now()}.pptx`
            };

            // 显示加载状态
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ 正在生成...';
            statusDiv.className = 'status info';
            statusDiv.textContent = '正在生成 PPT，请稍候...';

            try {
                const response = await fetch('http://localhost:8000/api/ppt/generate/from-text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // 下载文件
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = formData.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                // 显示成功消息
                statusDiv.className = 'status success';
                statusDiv.textContent = `✅ PPT 生成成功！文件已下载：${formData.filename}`;

            } catch (error) {
                console.error('Error:', error);
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ 生成失败：${error.message}。请确保后端服务正在运行（http://localhost:8000）`;
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = '🎨 生成 PPT';
            }
        });
    </script>
</body>
</html>
