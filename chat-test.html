<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天机器人测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header-icon {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .header h1 {
            font-size: 20px;
            margin: 0;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            margin-top: 5px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }
        .status-dot.online {
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        .status-dot.offline {
            background: #ef4444;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .message.bot .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .message.user .avatar {
            background: #3b82f6;
        }
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .message.bot .bubble {
            background: white;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .message.user .bubble {
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }
        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            min-height: 44px;
            max-height: 120px;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .file-btn {
            padding: 12px;
            background: #f1f5f9;
            color: #64748b;
        }
        .file-btn:hover {
            background: #e2e8f0;
            box-shadow: none;
        }
        .image-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .image-preview img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-size: 14px;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .card {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
        }
        .card-title {
            font-weight: 600;
            color: #1e40af;
            margin-bottom: 4px;
        }
        .card-type {
            font-size: 12px;
            color: #64748b;
        }
        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }
        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🤖</div>
            <div>
                <h1>智能聊天助手 (数据库版)</h1>
                <div class="status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">检查连接...</span>
                </div>
            </div>
        </div>
        
        <div class="messages" id="messages">
            <div class="welcome">
                <div class="welcome-icon">👋</div>
                <h2>欢迎使用智能聊天助手</h2>
                <p>我可以帮您查询知识库中的 175 张卡片</p>
                <p style="margin-top: 10px; font-size: 12px;">
                    试试输入: "搜索项目管理" 或 "查找风险卡片"
                </p>
            </div>
        </div>
        
        <div class="input-area">
            <div id="imagePreview"></div>
            <div class="input-container">
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <button class="file-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <textarea id="input" placeholder="输入消息... (Enter发送)" rows="1"></textarea>
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8002/api/chat/simple';
        let selectedImage = null;
        let isLoading = false;

        // 检查后端状态
        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                if (data.database && data.database.connected) {
                    document.getElementById('statusDot').className = 'status-dot online';
                    document.getElementById('statusText').textContent = 
                        `已连接 | ${data.database.card_count} 张卡片`;
                } else {
                    document.getElementById('statusDot').className = 'status-dot offline';
                    document.getElementById('statusText').textContent = '数据库未连接';
                }
            } catch (error) {
                document.getElementById('statusDot').className = 'status-dot offline';
                document.getElementById('statusText').textContent = '后端未启动';
            }
        }

        // 页面加载时检查状态
        checkStatus();
        setInterval(checkStatus, 5000);

        // 文件选择
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            selectedImage = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').innerHTML = `
                    <div class="image-preview">
                        <img src="${e.target.result}" alt="Preview">
                        <span>${file.name}</span>
                        <button onclick="clearImage()" style="padding: 4px 8px; font-size: 12px;">移除</button>
                    </div>
                `;
            };
            reader.readAsDataURL(file);
        });

        function clearImage() {
            selectedImage = null;
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('fileInput').value = '';
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('input');
            const query = input.value.trim();
            
            if (!query && !selectedImage) return;
            
            // 添加用户消息
            addMessage('user', query || '[图片]');
            input.value = '';
            
            isLoading = true;
            showLoading();
            
            try {
                let imageData = null;
                if (selectedImage) {
                    imageData = await fileToBase64(selectedImage);
                }
                
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query || '分析图片',
                        image_data: imageData,
                        conversation_history: [],
                        context: {}
                    })
                });
                
                const data = await response.json();
                
                // 添加机器人回复
                addMessage('bot', data.response);
                
                // 如果有卡片，显示卡片
                if (data.cards && data.cards.length > 0) {
                    data.cards.forEach(card => {
                        addCard(card);
                    });
                }
                
                clearImage();
            } catch (error) {
                addMessage('bot', '❌ 连接失败，请确保后端服务已启动 (python chat_server_with_db.py)');
            } finally {
                isLoading = false;
                hideLoading();
            }
        }

        function addMessage(role, content) {
            const messages = document.getElementById('messages');
            const welcome = messages.querySelector('.welcome');
            if (welcome) welcome.remove();
            
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar">${role === 'bot' ? '🤖' : '👤'}</div>
                <div class="bubble">${escapeHtml(content)}</div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function addCard(card) {
            const messages = document.getElementById('messages');
            const typeNames = {
                'blue': '🔵 事实',
                'green': '🟢 解释',
                'yellow': '🟡 风险',
                'red': '🔴 行动'
            };
            const typeName = typeNames[card.card_type] || card.card_type;
            
            const div = document.createElement('div');
            div.className = 'message bot';
            div.innerHTML = `
                <div class="avatar">📋</div>
                <div class="bubble">
                    <div class="card">
                        <div class="card-title">${escapeHtml(card.title)}</div>
                        <div class="card-type">${typeName}</div>
                        <div style="margin-top: 8px; color: #475569;">${escapeHtml(card.content)}</div>
                    </div>
                </div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function showLoading() {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message bot loading-message';
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble loading">
                    <div class="spinner"></div>
                    <span>思考中...</span>
                </div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function hideLoading() {
            const loading = document.querySelector('.loading-message');
            if (loading) loading.remove();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 回车发送
        document.getElementById('input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
