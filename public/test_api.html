<!DOCTYPE html>
<html>
<head><title>API Test</title></head>
<body>
<h1>前端API直接测试</h1>

<h2>1. 知识卡片</h2>
<input type="file" id="cardFile" accept=".pdf">
<button onclick="testCards()">生成知识卡片</button>
<pre id="cardResult"></pre>

<h2>2. 转Word</h2>
<input type="file" id="wordFile" accept=".pdf">
<button onclick="testWord()">转Word</button>
<pre id="wordResult"></pre>

<h2>3. 转Excel</h2>
<input type="file" id="excelFile" accept=".pdf">
<button onclick="testExcel()">转Excel</button>
<pre id="excelResult"></pre>

<script>
const API = 'http://localhost:8000';

async function testCards() {
  const file = document.getElementById('cardFile').files[0];
  if (!file) { alert('请选择文件'); return; }
  document.getElementById('cardResult').textContent = '处理中...';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(API + '/api/pdf/generate/four-color-cards', { method: 'POST', body: fd });
    const data = await r.json();
    document.getElementById('cardResult').textContent = JSON.stringify(data, null, 2);
  } catch(e) {
    document.getElementById('cardResult').textContent = 'ERROR: ' + e.message;
  }
}

async function testWord() {
  const file = document.getElementById('wordFile').files[0];
  if (!file) { alert('请选择文件'); return; }
  document.getElementById('wordResult').textContent = '处理中...';
  try {
    // Step 1: generate cards
    const fd = new FormData();
    fd.append('file', file);
    const r1 = await fetch(API + '/api/pdf/generate/four-color-cards', { method: 'POST', body: fd });
    const data = await r1.json();
    document.getElementById('wordResult').textContent = 'Step1 cards: ' + (data.cards||[]).length + '\n';
    
    // Step 2: export to word
    const r2 = await fetch(API + '/api/pdf/export/cards-docx', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cards: data.cards || [], title: 'Test', author: 'Test' })
    });
    
    if (r2.ok) {
      const blob = await r2.blob();
      document.getElementById('wordResult').textContent += 'Word blob size: ' + blob.size + ' bytes, type: ' + blob.type;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'test.docx'; a.click();
    } else {
      document.getElementById('wordResult').textContent += 'Word export failed: ' + r2.status;
    }
  } catch(e) {
    document.getElementById('wordResult').textContent = 'ERROR: ' + e.message;
  }
}

async function testExcel() {
  const file = document.getElementById('excelFile').files[0];
  if (!file) { alert('请选择文件'); return; }
  document.getElementById('excelResult').textContent = '处理中...';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(API + '/api/pdf/export/four-color-excel', { method: 'POST', body: fd });
    if (r.ok) {
      const blob = await r.blob();
      document.getElementById('excelResult').textContent = 'Excel blob size: ' + blob.size + ' bytes, type: ' + blob.type;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'test.xlsx'; a.click();
    } else {
      const text = await r.text();
      document.getElementById('excelResult').textContent = 'Failed: ' + r.status + ' ' + text;
    }
  } catch(e) {
    document.getElementById('excelResult').textContent = 'ERROR: ' + e.message;
  }
}
</script>
</body>
</html>
