name: Sync from Gitee

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      sync_branch:
        description: 'Branch to sync (default: main)'
        required: false
        default: 'main'
        type: string

# 不声明 permissions 块。
# 原因：本仓库的 workflow schema 校验器不认 `workflows` 这个键，写进去会直接
#   "Invalid workflow file"（Unexpected value 'workflows'）。
# 一旦显式写 `permissions`，所有未列出的 scope 会被降级为 none，
#   而 `workflows` 又无法在文件里声明 → 推送含 .github/workflows/* 的提交必被拒。
# 改法：依赖仓库默认权限
#   Settings → Actions → General → Workflow permissions = Read and write permissions
# 该默认已包含 contents: write 与 workflows: write。

env:
  GITEE_REPO: https://gitee.com/anbeime/zhiyi.git
  GITHUB_BRANCH: main
  GITEE_BRANCH: ${{ github.event.inputs.sync_branch || 'main' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GIT_TERMINAL_PROMPT: 0   # 无凭据时禁止卡在交互式密码提示
    steps:
      # 必须先 checkout：在 runner 上建立 .git 工作区并配置 origin 推送凭据
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Gitee Remote and Fetch
        run: |
          # Gitee 仓库为公开仓库，fetch 无需凭据；remote add 做幂等处理
          git remote add gitee "$GITEE_REPO" || git remote set-url gitee "$GITEE_REPO"
          git fetch gitee "$GITEE_BRANCH"
          git fetch origin "$GITHUB_BRANCH"

      - name: Check for Updates
        id: check_updates
        run: |
          GITEE_COMMIT=$(git rev-parse "gitee/$GITEE_BRANCH")
          GITHUB_COMMIT=$(git rev-parse "origin/$GITHUB_BRANCH")

          echo "Gitee commit: $GITEE_COMMIT"
          echo "GitHub commit: $GITHUB_COMMIT"

          if [ "$GITEE_COMMIT" = "$GITHUB_COMMIT" ]; then
            echo "No updates found. Repositories are in sync."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates found!"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "gitee_commit=$GITEE_COMMIT" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset to Gitee and Push
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          # 直接将 Gitee 的远程跟踪分支强制推送到 GitHub 对应分支（单向镜像）
          # 说明：这会覆盖 GitHub 分支上「仅存在于 GitHub」的提交
          git push origin "refs/remotes/gitee/$GITEE_BRANCH:refs/heads/$GITHUB_BRANCH" --force
          echo "Successfully synced from Gitee to GitHub!"

      - name: Create Sync Summary
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          echo "## Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Successfully synced from Gitee to GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source:** Gitee (${{ env.GITEE_REPO }})" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** GitHub (${{ github.server_url }}/${{ github.repository }})" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** ${{ env.GITEE_BRANCH }} → ${{ env.GITHUB_BRANCH }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Latest Commit:** ${{ steps.check_updates.outputs.gitee_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Sync Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"

      - name: No Updates Summary
        if: steps.check_updates.outputs.has_updates == 'false'
        run: |
          echo "## Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️ No updates found. Repositories are already in sync." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Checked at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
