            "*.user"
            "*.userosscache"
            "*.sln.docstates"
            "*.userprefs"
            "mono_crash.*"
            "[Dd]ebug/"
            "[Dd]ebugPublic/"
            "[Rr]elease/"
            "[Rr]eleases/"
            "x64/"
            "x86/"
            "[Ww][Ii][Nn]32/"
            "[Aa][Rr][Mm]/"
            "[Aa][Rr][Mm]64/"
            "bld/"
            "[Bb]in/"
            "[Oo]bj/"
            "[Ll]og/"
            "[Ll]ogs/"
            ".vs/"
            "Generated\ Files/"
            "[Tt]est[Rr]esult*/"
            "[Bb]uild[Ll]og.*"
            "*.VisualState.xml"
            "TestResult.xml"
            "nunit-*.xml"
            "[Dd]ebugPS/"
            "[Rr]eleasePS/"
            "dlldata.c"
            "BenchmarkDotNet.Artifacts/"
            "project.lock.json"
            "project.fragment.lock.json"
            "artifacts/"
            "ScaffoldingReadMe.txt"
            "StyleCopReport.xml"
            "*_h.h"
            "*.iobj"
            "*.ipdb"
            "*_wpftmp.csproj"
            "*.tlog"
            "*.svclog"
            "*.scc"
            "_Chutzpah*"
            "ipch/"
            "$tf/"
            "*.gpState"
            "_ReSharper*/"
            "*.[Rr]e[Ss]harper"
            "_TeamCity*"
            "*.dotCover"
            "_NCrunch_*"
            ".*crunch*.local.xml"
            "nCrunchTemp_*"
            "*.mm.*"
            "AutoTest.Net/"
            ".sass-cache/"
            "[Ee]xpress/"
            "DocProject/buildhelp/"
            "DocProject/Help/*.HxT"
            "DocProject/Help/*.HxC"
            "DocProject/Help/*.hhc"
            "DocProject/Help/*.hhk"
            "DocProject/Help/*.hhp"
            "DocProject/Help/Html2"
            "DocProject/Help/html"
            "publish/"
            "*.[Pp]ublish.xml"
            "*.azurePubxml"
            "*.pubxml"
            "*.publishproj"
            "PublishScripts/"
            "*.nupkg"
            "*.snupkg"
          )
          
          declare -a DIR_PATTERNS=(
            "tests/"
            "test/"
            "__tests__/"
            "__test__/"
            "spec/"
            "specs/"
            "__pycache__/"
            ".pytest_cache/"
            "htmlcov/"
            "cover/"
            ".tox/"
            ".nox/"
            ".hypothesis/"
            ".eggs/"
            "*.egg-info/"
            "dist/"
            "build/"
            "develop-eggs/"
            "downloads/"
            "eggs/"
            "lib/"
            "lib64/"
            "parts/"
            "sdist/"
            "var/"
            "wheels/"
            "share/python-wheels/"
            "instance/"
            ".webassets-cache"
            ".scrapy"
            "docs/_build/"
            "site/"
            ".pybuilder/"
            "target/"
            ".ipynb_checkpoints"
            "profile_default/"
            "__pypackages__/"
            ".venv/"
            "venv/"
            "env/"
            "ENV/"
            "env.bak/"
            "venv.bak/"
            ".ropeproject"
            ".spyderproject"
            ".spyproject"
            "nbproject/"
            ".komodotools/"
            ".idea_modules/"
            ".history/"
            ".nyc_output/"
            ".grunt"
            "bower_components/"
            ".rpt_cache/"
            ".next/"
            ".nuxt/"
            ".vuepress/dist"
            ".temp/"
            ".cache/"
            ".serverless/"
            ".fusebox/"
            ".dynamodb/"
            ".vscode-test/"
            ".vscode-test-container/"
            ".devcontainer/"
            ".vs/"
            "Generated\ Files/"
            "[Tt]est[Rr]esult*/"
            "BenchmarkDotNet.Artifacts/"
            "artifacts/"
            "_ReSharper*/"
            "_TeamCity*"
            "_NCrunch_*"
            "AutoTest.Net/"
            ".sass-cache/"
            "[Ee]xpress/"
            "DocProject/buildhelp/"
            "DocProject/Help/Html2"
            "DocProject/Help/html"
            "publish/"
            "PublishScripts/"
            "node_modules/"
            ".terraform/"
            ".vagrant/"
            "packer_cache/"
            "output-*/"
            ".idea/"
            ".vscode/"
          )
          
          # Scan file patterns
          for pattern in "${FILE_PATTERNS[@]}"; do
            files=$(find . -type f -name "$pattern" 2>/dev/null | grep -v ".git" || true)
            if [ -n "$files" ]; then
              count=$(echo "$files" | wc -l)
              FOUND_COUNT=$((FOUND_COUNT + count))
              ALL_FILES="$ALL_FILES
$files"
              for f in $files; do
                s=$(stat -c%s "$f" 2>/dev/null || echo 0)
                TOTAL_SIZE=$((TOTAL_SIZE + s))
              done
            fi
          done
          
          # Scan directory patterns
          for pattern in "${DIR_PATTERNS[@]}"; do
            dirs=$(find . -type d -name "${pattern%/}" 2>/dev/null | grep -v ".git" || true)
            if [ -n "$dirs" ]; then
              count=$(echo "$dirs" | wc -l)
              FOUND_COUNT=$((FOUND_COUNT + count))
              for d in $dirs; do
                s=$(du -sb "$d" 2>/dev/null | cut -f1 || echo 0)
                TOTAL_SIZE=$((TOTAL_SIZE + s))
              done
            fi
          done
          
          # Convert size to human readable
          if [ $TOTAL_SIZE -gt 1073741824 ]; then
            SIZE_HUMAN="$(awk "BEGIN {printf \"%.2f\", $TOTAL_SIZE/1073741824}") GB"
          elif [ $TOTAL_SIZE -gt 1048576 ]; then
            SIZE_HUMAN="$(awk "BEGIN {printf \"%.2f\", $TOTAL_SIZE/1048576}") MB"
          elif [ $TOTAL_SIZE -gt 1024 ]; then
            SIZE_HUMAN="$(awk "BEGIN {printf \"%.2f\", $TOTAL_SIZE/1024}") KB"
          else
            SIZE_HUMAN="$TOTAL_SIZE bytes"
          fi
          
          echo "TOTAL_SIZE_HUMAN=$SIZE_HUMAN" >> "$GITHUB_ENV"
          echo "FOUND_COUNT=$FOUND_COUNT" >> "$GITHUB_ENV"
          
          echo "### Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Found $FOUND_COUNT items" >> "$GITHUB_STEP_SUMMARY"
          echo "Total size: $SIZE_HUMAN" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ $FOUND_COUNT -eq 0 ]; then
            echo "found_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "found_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview or Delete
        id: action
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          
          if [ "$DRY_RUN" = "true" ]; then
            echo "## Preview Mode" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Found ${{ env.FOUND_COUNT }} items to delete" >> "$GITHUB_STEP_SUMMARY"
            echo "Total size: ${{ env.TOTAL_SIZE_HUMAN }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "To delete, run again with Preview mode unchecked" >> "$GITHUB_STEP_SUMMARY"
            echo "will_delete=false" >> "$GITHUB_OUTPUT"
          else
            echo "will_delete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete All Redundant Files
        if: steps.action.outputs.will_delete == 'true'
        run: |
          set +e
          echo "## Deleting redundant files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          # Delete file patterns
          find . -type f \( \
            -name "test_*.py" -o \
            -name "*_test.py" -o \
            -name "*_tests.py" -o \
            -name "test-*.py" -o \
            -name "*-test.py" -o \
            -name "*.spec.js" -o \
            -name "*.spec.ts" -o \
            -name "*.test.js" -o \
            -name "*.test.ts" -o \
            -name "*.spec.jsx" -o \
            -name "*.spec.tsx" -o \
            -name "*.test.jsx" -o \
            -name "*.test.tsx" -o \
            -name "*.pyc" -o \
            -name "*.pyo" -o \
            -name "*.pyd" -o \
            -name "*.so" -o \
            -name "*.dylib" -o \
            -name "*.dll" -o \
            -name "*.class" -o \
            -name "*.o" -o \
            -name "*.obj" -o \
            -name "*.exe" -o \
            -name "*.log" -o \
            -name "*.tmp" -o \
            -name "*.temp" -o \
            -name "*.swp" -o \
            -name "*.swo" -o \
            -name "*~" -o \
            -name "*.bak" -o \
            -name "*.orig" -o \
            -name "*.rej" -o \
            -name ".DS_Store" -o \
            -name "Thumbs.db" -o \
            -name "desktop.ini" \
          \) -not -path "./.git/*" -delete 2>/dev/null
          
          # Delete directory patterns
          find . -type d \( \
            -name "tests" -o \
            -name "test" -o \
            -name "__tests__" -o \
            -name "__test__" -o \
            -name "spec" -o \
            -name "specs" -o \
            -name "__pycache__" -o \
            -name ".pytest_cache" -o \
            -name "htmlcov" -o \
            -name "cover" -o \
            -name ".tox" -o \
            -name ".nox" -o \
            -name ".hypothesis" -o \
            -name ".eggs" -o \
            -name "*.egg-info" -o \
            -name "dist" -o \
            -name "build" -o \
            -name "develop-eggs" -o \
            -name "downloads" -o \
            -name "eggs" -o \
            -name "lib" -o \
            -name "lib64" -o \
            -name "parts" -o \
            -name "sdist" -o \
            -name "var" -o \
            -name "wheels" -o \
            -name "instance" -o \
            -name ".webassets-cache" -o \
            -name ".scrapy" -o \
            -name "site" -o \
            -name ".pybuilder" -o \
            -name "target" -o \
            -name ".ipynb_checkpoints" -o \
            -name "profile_default" -o \
            -name "__pypackages__" -o \
            -name ".venv" -o \
            -name "venv" -o \
            -name "env" -o \
            -name "ENV" -o \
            -name "env.bak" -o \
            -name "venv.bak" -o \
            -name ".ropeproject" -o \
            -name ".spyderproject" -o \
            -name ".spyproject" -o \
            -name "nbproject" -o \
            -name ".komodotools" -o \
            -name ".idea_modules" -o \
            -name ".history" -o \
            -name ".nyc_output" -o \
            -name ".grunt" -o \
            -name "bower_components" -o \
            -name ".rpt_cache" -o \
            -name ".next" -o \
            -name ".nuxt" -o \
            -name ".temp" -o \
            -name ".cache" -o \
            -name ".serverless" -o \
            -name ".fusebox" -o \
            -name ".dynamodb" -o \
            -name ".vscode-test" -o \
            -name ".vscode-test-container" -o \
            -name ".devcontainer" -o \
            -name ".vs" -o \
            -name "BenchmarkDotNet.Artifacts" -o \
            -name "artifacts" -o \
            -name "_ReSharper*" -o \
            -name "_TeamCity*" -o \
            -name "_NCrunch_*" -o \
            -name "AutoTest.Net" -o \
            -name ".sass-cache" -o \
            -name "node_modules" -o \
            -name ".terraform" -o \
            -name ".vagrant" -o \
            -name "packer_cache" -o \
            -name ".idea" -o \
            -name ".vscode" \
          \) -not -path "./.git/*" -exec rm -rf {} + 2>/dev/null
          
          echo "Files deleted successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "Freed space: ${{ env.TOTAL_SIZE_HUMAN }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for Changes
        if: steps.action.outputs.will_delete == 'true'
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push Changes
        if: steps.action.outputs.will_delete == 'true' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore: cleanup redundant files

          - Removed test files and directories
          - Cleaned up cache and build files
          - Removed IDE and editor files
          - Freed up ${{ env.TOTAL_SIZE_HUMAN }} of space

          Auto-generated by GitHub Actions"
          git push origin main
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Changes committed and pushed" >> "$GITHUB_STEP_SUMMARY"

      - name: No Files Found
        if: steps.find_files.outputs.found_files == 'false'
        run: |
          echo "## Cleanup Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No redundant files found" >> "$GITHUB_STEP_SUMMARY"
