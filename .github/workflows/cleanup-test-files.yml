            ".ipynb_checkpoints"
            "profile_default/"
            "ipython_config.py"
            ".python-version"
            "__pypackages__/"
            "celerybeat-schedule"
            "celerybeat.pid"
            "*.sage.py"
            ".env"
            ".venv"
            "env/"
            "venv/"
            "ENV/"
            "env.bak/"
