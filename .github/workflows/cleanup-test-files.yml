name: Cleanup Redundant Test Files

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview mode (no actual deletion)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find and List Redundant Files
        id: find_files
        run: |
          set +e
          echo "## Scanning for redundant files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          FOUND_COUNT=0
          TOTAL_SIZE=0
          
          # Scan test_*.py
          echo "### Scanning test_*.py" >> "$GITHUB_STEP_SUMMARY"
          files=$(find . -type f -name "test_*.py" 2>/dev/null | grep -v ".git")
          if [ -n "$files" ]; then
            echo 'Found files:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$files" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            FOUND_COUNT=$((FOUND_COUNT + $(echo "$files" | wc -l)))
            for f in $files; do
              s=$(stat -c%s "$f" 2>/dev/null || echo 0)
              TOTAL_SIZE=$((TOTAL_SIZE + s))
            done
          else
            echo "Not found" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          # Scan *_test.py
          echo "### Scanning *_test.py" >> "$GITHUB_STEP_SUMMARY"
          files=$(find . -type f -name "*_test.py" 2>/dev/null | grep -v ".git")
          if [ -n "$files" ]; then
            echo 'Found files:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$files" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            FOUND_COUNT=$((FOUND_COUNT + $(echo "$files" | wc -l)))
            for f in $files; do
              s=$(stat -c%s "$f" 2>/dev/null || echo 0)
              TOTAL_SIZE=$((TOTAL_SIZE + s))
            done
          else
            echo "Not found" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          # Scan tests/ directories
          echo "### Scanning tests/ directories" >> "$GITHUB_STEP_SUMMARY"
          dirs=$(find . -type d -name "tests" 2>/dev/null | grep -v ".git")
          if [ -n "$dirs" ]; then
            echo 'Found directories:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$dirs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            FOUND_COUNT=$((FOUND_COUNT + $(echo "$dirs" | wc -l)))
            for d in $dirs; do
              s=$(du -sb "$d" 2>/dev/null | cut -f1 || echo 0)
              TOTAL_SIZE=$((TOTAL_SIZE + s))
            done
          else
            echo "Not found" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          # Scan __pycache__/ directories
          echo "### Scanning __pycache__/ directories" >> "$GITHUB_STEP_SUMMARY"
          dirs=$(find . -type d -name "__pycache__" 2>/dev/null | grep -v ".git")
          if [ -n "$dirs" ]; then
            echo 'Found directories:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$dirs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            FOUND_COUNT=$((FOUND_COUNT + $(echo "$dirs" | wc -l)))
            for d in $dirs; do
              s=$(du -sb "$d" 2>/dev/null | cut -f1 || echo 0)
              TOTAL_SIZE=$((TOTAL_SIZE + s))
            done
          else
            echo "Not found" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          # Scan *.pyc files
          echo "### Scanning *.pyc files" >> "$GITHUB_STEP_SUMMARY"
          files=$(find . -type f -name "*.pyc" 2>/dev/null | grep -v ".git")
          if [ -n "$files" ]; then
            echo 'Found files:' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$files" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            FOUND_COUNT=$((FOUND_COUNT + $(echo "$files" | wc -l)))
            for f in $files; do
              s=$(stat -c%s "$f" 2>/dev/null || echo 0)
              TOTAL_SIZE=$((TOTAL_SIZE + s))
            done
          else
            echo "Not found" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          # Convert size to human readable
          if [ $TOTAL_SIZE -gt 1073741824 ]; then
            SIZE_HUMAN="$(awk "BEGIN {printf \"%.2f\", $TOTAL_SIZE/1073741824}") GB"
          elif [ $TOTAL_SIZE -gt 1048576 ]; then
            SIZE_HUMAN="$(awk "BEGIN {printf \"%.2f\", $TOTAL_SIZE/1048576}") MB"
          elif [ $TOTAL_SIZE -gt 1024 ]; then
            SIZE_HUMAN="$(awk "BEGIN {printf \"%.2f\", $TOTAL_SIZE/1024}") KB"
          else
            SIZE_HUMAN="$TOTAL_SIZE bytes"
          fi
          
          echo "TOTAL_SIZE_HUMAN=$SIZE_HUMAN" >> "$GITHUB_ENV"
          echo "FOUND_COUNT=$FOUND_COUNT" >> "$GITHUB_ENV"
          
          echo "Found $FOUND_COUNT items, total size: $SIZE_HUMAN"
          
          if [ $FOUND_COUNT -eq 0 ]; then
            echo "found_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "found_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete Files (Dry Run)
        if: github.event.inputs.dry_run == 'true' && steps.find_files.outputs.found_files == 'true'
        run: |
          echo "## Preview Mode" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview mode - no files were deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Found ${{ env.FOUND_COUNT }} items, total size: ${{ env.TOTAL_SIZE_HUMAN }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To actually delete, run again and uncheck 'Preview mode'" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete Files (Actual)
        if: github.event.inputs.dry_run == 'false' && steps.find_files.outputs.found_files == 'true'
        run: |
          set +e
          echo "## Deleting redundant files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          # Delete test_*.py
          find . -type f -name "test_*.py" -not -path "./.git/*" -delete 2>/dev/null
          
          # Delete *_test.py
          find . -type f -name "*_test.py" -not -path "./.git/*" -delete 2>/dev/null
          
          # Delete tests/ directories
          find . -type d -name "tests" -not -path "./.git/*" -exec rm -rf {} + 2>/dev/null
          
          # Delete __pycache__/ directories
          find . -type d -name "__pycache__" -not -path "./.git/*" -exec rm -rf {} + 2>/dev/null
          
          # Delete *.pyc
          find . -type f -name "*.pyc" -not -path "./.git/*" -delete 2>/dev/null
          
          echo "Files deleted successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Freed space: ${{ env.TOTAL_SIZE_HUMAN }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for Changes
        if: github.event.inputs.dry_run == 'false' && steps.find_files.outputs.found_files == 'true'
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push Changes
        if: github.event.inputs.dry_run == 'false' && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore: cleanup redundant test files

          - Removed test files and directories
          - Cleaned up cache files
          - Freed up ${{ env.TOTAL_SIZE_HUMAN }} of space

          Auto-generated by GitHub Actions"
          git push origin main
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Changes committed and pushed" >> "$GITHUB_STEP_SUMMARY"

      - name: No Changes Summary
        if: steps.find_files.outputs.found_files == 'false'
        run: |
          echo "## Cleanup Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No redundant files found, nothing to clean up" >> "$GITHUB_STEP_SUMMARY"
