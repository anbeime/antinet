name: Cleanup All Redundant Files

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview mode (no actual deletion)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find All Redundant Files
        id: find_files
        run: |
          set +e
          echo "## Scanning for all redundant files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          FOUND_COUNT=0
          TOTAL_SIZE=0
          ALL_FILES=""
          
          # Define patterns to scan
          declare -a FILE_PATTERNS=(
            "test_*.py"
            "*_test.py"
            "*_tests.py"
            "test-*.py"
            "*-test.py"
            "*.spec.js"
            "*.spec.ts"
            "*.test.js"
            "*.test.ts"
            "*.spec.jsx"
            "*.spec.tsx"
            "*.test.jsx"
            "*.test.tsx"
            "*.pyc"
            "*.pyo"
            "*.pyd"
            "*.so"
            "*.dylib"
            "*.dll"
            "*.class"
            "*.o"
            "*.obj"
            "*.exe"
