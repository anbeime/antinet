# Antinet - 技能配置文件
# 项目：AI智能体网络平台
# 最后更新：2026-02-17

project:
  name: "Antinet"
  code_name: "antinet"
  description: "AI智能体网络平台 - 多智能体协作系统"
  version: "1.0.0"
  status: "开发中"

skills:
  # 系统内置技能 - 直接使用
  builtin:
    - name: pptx
      description: "PPT演示文稿创建与编辑"
      use_cases:
        - "生成项目介绍PPT"
        - "制作技术方案展示"
        - "功能演示文稿"
      priority: "high"

    - name: xlsx
      description: "Excel数据处理与分析"
      use_cases:
        - "功能清单整理"
        - "测试用例管理"
        - "数据分析报告"
      priority: "high"

    - name: docx
      description: "Word文档创建与编辑"
      use_cases:
        - "技术架构文档"
        - "API接口文档"
        - "用户操作手册"
        - "部署指南"
      priority: "high"

    - name: pdf
      description: "PDF文档处理"
      use_cases:
        - "生成PDF文档"
        - "PDF表单处理"
      priority: "medium"

  # 本地技能 - 从参考项目复制
  local:
    - name: reddit-sentiment-analysis
      file: "../skills/reddit-sentiment-analysis.skill"
      description: "Reddit舆情情感分析 - 海外市场调研核心技能"
      use_cases:
        - "海外市场用户调研"
        - "AI产品话题分析"
        - "竞品品牌声誉监测"
        - "目标市场痛点挖掘"
        - "用户情感趋势分析"
      priority: "high"
      data_source: "Reddit API"
      capabilities:
        - "多语言情感分析"
        - "实时数据抓取"
        - "情感趋势可视化"
        - "关键词提取"
        - "子版块定向分析"

    - name: hand-drawn-infographic
      file: "../skills/hand-drawn-infographic.skill"
      description: "手绘风格信息图生成"
      use_cases:
        - "系统架构图"
        - "运营流程图"
        - "功能模块图"
        - "技术架构可视化"
      priority: "high"
      status: "missing"
      fallback: "使用Python代码生成架构图（matplotlib/graphviz）"

    - name: concept-sector-analysis
      file: "../skills/concept-sector-analysis.skill"
      description: "概念板块分析"
      use_cases:
        - "AI产品市场分析"
        - "智能体平台市场研究"
        - "竞争格局分析"
        - "技术发展趋势"
      priority: "medium"
      status: "missing"
      fallback: "使用WebSearch + xlsx技能进行市场分析"

  # Antinet专用技能（待开发）
  antinet_specific:
    - name: card-management
      description: "四色卡片系统管理"
      use_cases:
        - "卡片数据分析"
        - "卡片导出报告"
        - "卡片统计可视化"
      priority: "high"
      status: "planned"

    - name: knowledge-import
      description: "知识库智能导入"
      use_cases:
        - "文档智能解析"
        - "知识库构建"
        - "内容分类整理"
      priority: "high"
      status: "planned"

    - name: vector-search
      description: "向量搜索"
      use_cases:
        - "语义搜索"
        - "相似度匹配"
        - "知识检索"
      priority: "high"
      status: "planned"

    - name: gtd-task
      description: "GTD任务管理"
      use_cases:
        - "任务分析报告"
        - "执行进度跟踪"
        - "效率统计"
      priority: "medium"
      status: "planned"

    - name: multi-model
      description: "多模型管理"
      use_cases:
        - "模型性能分析"
        - "模型切换配置"
        - "推理统计报告"
      priority: "medium"

    - name: vision-analysis
      description: "视觉分析"
      use_cases:
        - "图像识别报告"
        - "多模态交互分析"
        - "视觉能力测试"
      priority: "medium"

    - name: npu-optimization
      description: "NPU优化"
      use_cases:
        - "NPU性能分析"
        - "优化建议报告"
        - "兼容性测试"
      priority: "low"

# 项目目录结构
directory_structure:
  auto: "./auto"
  backend: "../backend"
    agents: "../backend/agents"
    api: "../backend/api"
    routes: "../backend/routes"
    services: "../backend/services"
    skills: "../backend/skills"
    models: "../backend/models"
  src: "../src"
  data: "../data"
  scripts: "../scripts"
  output: "../output"
    docs: "../output/docs"
    images: "../output/images"
    analysis: "../output/analysis"
    exports: "../output/exports"

# 自动化开发配置
automation:
  enabled: true
  mode: "continuous"  # continuous = 持续开发直到完成

  workflow:
    step1: "读取当前任务状态（./task-status.json）"
    step2: "选择下一个未完成任务"
    step3: "执行开发任务"
    step4: "验证结果"
    step5: "更新任务状态"
    step6: "记录进度（./progress.txt）"
    step7: "如未全部完成，返回step1"

  task_status_file: "./task-status.json"
  progress_file: "./progress.txt"

  # 自动确认规则（无需人工确认）
  auto_confirm_rules:
    - "文件保存到正确目录"
    - "命名符合规范"
    - "格式符合要求"
    - "内容完整无遗漏"

  # 需要人工介入的情况
  manual_intervention:
    - "任务描述不明确"
    - "技术方案需要决策"
    - "多个选项需要选择"
    - "出现错误无法自动修复"

