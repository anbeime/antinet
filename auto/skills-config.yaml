# 提示词模板
prompts:
  system_architecture: |
    分析Antinet项目代码架构并生成技术文档：

    1. 目录结构分析：
       - ../backend/ 目录：agents, api, routes, services, skills, models
       - ../src/ 目录：前端React组件
       - ../data/ 目录：数据库文件

    2. 核心模块：
       - 智能卡片系统（四色卡片）
       - AI对话系统（多模型支持）
       - 知识库管理（向量搜索）
       - GTD任务系统
       - 文档处理（PDF/Word/Excel/PPT）
       - 视觉能力（图像识别）
       - NPU加速

    3. 技术栈：
       - 前端：React + TypeScript + Vite + TailwindCSS
       - 后端：FastAPI + Python
       - 数据库：SQLite + 向量数据库
       - AI模型：Qwen2.5-VL、BGE嵌入模型
       - 硬件：Qualcomm NPU (QNN)

    注意：
    - 如 hand-drawn-infographic 技能不可用，使用Python代码生成架构图
    - 可使用 matplotlib、graphviz 或 PIL 绘制架构图
    - 确保图片清晰、布局合理、文字可读

    输出：
    - 系统架构图：../output/images/系统架构图_Antinet.png
    - 技术文档：../output/docs/技术架构文档_Antinet.docx

  api_documentation: |
    扫描Antinet后端API并生成文档：

    1. 扫描目录：../backend/routes/
    2. 提取信息：
       - 路由路径
       - HTTP方法
       - 请求参数
       - 响应格式
       - 错误码

    3. 主要路由模块：
       - cards.py - 卡片管理
       - chat_routes.py - AI对话
       - knowledge_routes.py - 知识库
       - gtd_routes.py - GTD任务
       - document_routes.py - 文档处理
       - vision_routes.py - 视觉API
       - model_routes.py - 模型管理

    输出：
    - OpenAPI规范：../output/docs/openapi.json
    - API文档：../output/docs/API接口文档_Antinet.docx

  feature_list: |
    整理Antinet功能清单：

    1. 核心功能模块：
       - 卡片管理：创建、编辑、删除、搜索、导出
       - AI对话：多轮对话、模型切换、历史记录
       - 知识库：文档导入、向量搜索、智能问答
       - GTD任务：任务创建、执行跟踪、提醒
       - 文档处理：PDF解析、Word导出、Excel分析、PPT生成
       - 视觉能力：图像识别、多模态对话

    2. 系统功能：
       - 用户管理
       - 数据备份
       - 系统设置
       - 日志管理

    3. 输出格式：
       - Excel表格
       - 包含：模块、功能、描述、优先级、状态

    输出：
    - 功能清单：../output/docs/功能清单_Antinet.xlsx
    - 测试用例：../output/docs/测试用例_Antinet.xlsx

  user_manual: |
    编写Antinet用户操作手册：

    1. 系统介绍
       - 产品概述
       - 核心功能
       - 适用场景

    2. 快速开始
       - 系统要求
       - 安装步骤
       - 首次启动

    3. 功能使用指南
       - 卡片管理：创建四色卡片、搜索筛选、导出
       - AI对话：开始对话、切换模型、查看历史
       - 知识库：导入文档、语义搜索、知识问答
       - GTD任务：创建任务、执行任务、跟踪进度
       - 文档处理：上传文档、智能分析、导出报告

    4. 常见问题
       - 安装问题
       - 使用问题
       - 性能优化

    输出：
    - 用户手册：../output/docs/用户操作手册_Antinet.docx

  deployment_guide: |
    编写Antinet部署指南：

    1. 环境要求
       - 操作系统：Windows 10/11, Linux, macOS
       - Python：3.9+
       - Node.js：18+
       - 硬件：支持NPU（可选）

    2. 开发环境部署
       - 克隆代码
       - 安装Python依赖
       - 安装Node.js依赖
       - 配置环境变量
       - 启动后端服务
       - 启动前端服务

    3. 生产环境部署
       - 构建前端
       - 配置生产环境
       - 部署后端服务
       - 配置反向代理

    4. 常见问题
       - 端口冲突
       - 依赖安装失败
       - NPU配置问题
       - 数据库连接问题

    输出：
    - 部署指南：../output/docs/部署指南_Antinet.docx

  frontend_backend_check: |
    检查Antinet前后端接口对接情况：

    1. 分析前端API调用：
       - 扫描 ../src/ 目录下的API调用代码
       - 识别所有fetch/axios调用
       - 提取调用的接口路径、方法、参数

    2. 对比后端API定义：
       - 扫描 ../backend/routes/ 下的路由定义
       - 对比前端调用与后端定义
       - 检查路径匹配性
       - 检查HTTP方法匹配性
       - 检查请求参数匹配性
       - 检查响应格式一致性

    3. 识别问题：
       - 前端调用但后端未定义的接口
       - 后端定义但前端未调用的接口
       - 参数不匹配的接口
       - 路径拼写错误的接口

    4. 生成报告：
       - 对接检查报告
       - 问题清单（按严重程度分类）
       - 修复建议

    输出：
    - 对接检查报告：../output/docs/前后端对接检查报告_Antinet.docx
    - 问题清单：../output/docs/接口对接问题清单.xlsx

  functional_test: |
    执行Antinet功能测试：

    1. 环境准备：
       - 检查Python环境
       - 安装依赖：pip install -r ../backend/requirements.txt
       - 启动后端服务：python ../backend/main.py
       - 等待服务启动（检查健康接口）

    2. API测试：
       - 测试健康检查接口
       - 测试卡片管理API（增删改查）
       - 测试AI对话API
       - 测试知识库API
       - 测试GTD任务API
       - 测试文档处理API
       - 测试视觉API
       - 测试模型管理API

    3. 测试记录：
       - 记录每个API的测试结果
       - 记录响应时间
       - 记录错误信息
       - 截图保存（如有UI测试）

    4. 生成报告：
       - 测试执行报告
       - 测试结果汇总表
       - 失败用例详细说明
       - 性能指标统计

    输出：
    - 测试报告：../output/docs/功能测试执行报告_Antinet.docx
    - 结果汇总：../output/docs/测试结果汇总.xlsx

  git_push: |
    推送Antinet项目到Git仓库：

    1. 检查Git状态：
       - 确认当前在Git仓库中
       - 检查远程仓库配置
       - 检查当前分支

    2. 准备提交：
       - 查看变更文件列表
       - 添加所有文档文件：git add ../output/
       - 添加配置文件：git add ./
       - 检查是否有大文件（>100MB）

    3. 创建提交：
       - 提交信息格式：
         ```
         docs: 自动化文档生成完成
         
         - 生成系统架构文档
         - 生成API接口文档
         - 生成功能清单和测试用例
         - 生成用户操作手册
         - 生成部署指南
         - 完成前后端对接检查
         - 执行功能测试
         - 生成所有文档清单
         
         生成时间：{当前时间}
         ```
       - 创建提交：git commit -m "提交信息"

    4. 推送到远程：
       - 拉取最新代码：git pull origin {分支名}
       - 解决冲突（如有）
       - 推送到远程：git push origin {分支名}
       - 验证推送成功

    5. 输出确认：
       - 显示提交哈希
       - 显示推送的分支
       - 显示远程仓库URL

    注意：
    - 确保已配置Git用户信息
    - 确保有推送权限
    - 如遇冲突需手动解决

# 一键命令快捷方式
quick_commands:
  生成架构图: "python ../scripts/generate_architecture.py"
  生成API文档: "python ../scripts/generate_api_docs.py"
  整理功能清单: "python ../scripts/generate_feature_list.py"
  生成用户手册: "python ../scripts/generate_user_manual.py"
  生成部署指南: "python ../scripts/generate_deployment_guide.py"
  完整流程: "python ../scripts/run_full_workflow.py"

# 文件命名规范
naming_conventions:
  docs: "{文档类型}_Antinet_v{版本号}.{扩展名}"
  images: "{图片类型}_Antinet_v{版本号}.png"
  analysis: "{分析类型}_Antinet_v{版本号}.{扩展名}"
  version_format: "1"
  date_format: "YYYYMMDD"

# 输出质量检查清单
quality_checklist:
  docs:
    - "格式规范（字体、字号、行距）"
    - "标题层级清晰"
    - "图表清晰可读"
    - "无错别字"
    - "页码完整"
  images:
    - "分辨率足够（至少1920x1080）"
    - "文字清晰可读"
    - "配色协调"
    - "文件大小适中"
  code:
    - "代码格式正确"
    - "注释完整"
    - "无语法错误"
